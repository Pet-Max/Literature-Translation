# release.yml — 发布工作流：tag v* 推送 / 手动触发 → 解析版本 → 门禁 → 构建
#              → 打包便携版 ∥ 打包安装版（并行、各自计时）→ 发布 Release。
# 门禁复用 .github/actions/gate（与 check.yml 同一实现）；本工作流永不触发于分支 push。
#
# ── 触发场景对照 ─────────────────────────────────────────────────────
#   push v* tag                   → 解析版本与守卫 → 门禁 → 构建 → 双包并行 → 稳定版发布
#   dispatch（channel=stable）    → 重发最新稳定版 / 指定 tag（守卫生效；tag 须已存在）
#   dispatch（channel=prerelease）→ 版本覆盖或自动+1，预发布（版本核对；tag 可代建）
#   dispatch（publish 不勾）      → 只构建不发布，产物留在 run Artifacts 供人工检查
# ─────────────────────────────────────────────────────────────────────
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "发布通道"
        required: false
        type: choice
        options: [stable, prerelease]
        default: stable
      tag:
        description: "版本号覆盖（如 v1.2.0-rc.1）；留空自动推算。stable 通道须为远端已存在的 tag"
        required: false
        type: string
      publish:
        description: "构建后发布 Release（不勾 = 只构建，产物留 Artifacts）"
        required: false
        type: boolean
        default: true

permissions:
  contents: read # 默认只读；publish job 单独提权写 Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # 发布不可互相打断：排队执行

jobs:
  # 解析先于门禁；门禁及构建固定使用解析出的提交。
  # ── Job 1：质量门禁（复用 composite，与 check.yml 同一实现） ──────────
  gate:
    name: 质量门禁
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}
      - uses: ./.github/actions/gate

  # ── Job 2：解析版本号（通道决定守卫与推算；outputs 含 publish 门条件） ──
  resolve:
    name: 解析版本号
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT: ${{ github.event_name }}
      CHANNEL: ${{ inputs.channel }}
      OVERRIDE: ${{ inputs.tag }}
      PUBLISH_INPUT: ${{ inputs.publish }}
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      # 解析脚本取自触发时的固定提交，目标标签由脚本解析
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: 解析版本号
        id: resolve
        shell: bash
        # 逻辑外置：.github/scripts/resolve-version.sh（env 经 job 级注入）
        run: bash .github/scripts/resolve-version.sh

  # ── Job 3：构建主程序（只编译一次，staging 供两个打包 job 并行取料） ────
  build:
    name: 构建主程序
    needs: [gate, resolve]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Build main exe
        run: go build -tags desktop,production -ldflags "-H windowsgui" -o build/bin/Literature-Translation.exe .

      - name: Validate Windows resources
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'build/bin/Literature-Translation.exe').Path
          $expected = $env:RELEASE_VERSION
          $core = ($expected -split '[-+]', 2)[0]
          $fixed = "$core.0"
          $info = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if ($info.ProductVersion -cne $expected -or $info.FileVersion -cne $fixed) { throw 'EXE 版本与发布版本不一致' }
          if ((@($info.FileMajorPart, $info.FileMinorPart, $info.FileBuildPart, $info.FilePrivatePart) -join '.') -ne $fixed -or
              (@($info.ProductMajorPart, $info.ProductMinorPart, $info.ProductBuildPart, $info.ProductPrivatePart) -join '.') -ne $fixed) { throw 'EXE 数值版本与发布版本不一致' }
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class ReleaseResources {
              [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Unicode)]
              public struct ACTCTX {
                  public uint cbSize; public uint dwFlags; public string lpSource;
                  public ushort wProcessorArchitecture; public ushort wLangId;
                  public string lpAssemblyDirectory; public IntPtr lpResourceName;
                  public string lpApplicationName; public IntPtr hModule;
              }
              [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
              public static extern IntPtr LoadLibraryExW(string path, IntPtr file, uint flags);
              [DllImport("kernel32.dll")] public static extern bool FreeLibrary(IntPtr module);
              [DllImport("kernel32.dll", CharSet=CharSet.Unicode)]
              public static extern IntPtr FindResourceW(IntPtr module, IntPtr name, IntPtr type);
              [DllImport("kernel32.dll")] public static extern uint SizeofResource(IntPtr module, IntPtr resource);
              [DllImport("kernel32.dll")] public static extern IntPtr LoadResource(IntPtr module, IntPtr resource);
              [DllImport("kernel32.dll")] public static extern IntPtr LockResource(IntPtr resource);
              [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
              public static extern IntPtr CreateActCtxW(ref ACTCTX context);
              [DllImport("kernel32.dll")] public static extern void ReleaseActCtx(IntPtr context);
          }
          '@
          # 以资源数据方式读取，不执行程序入口。
          $module = [ReleaseResources]::LoadLibraryExW($exe, [IntPtr]::Zero, 2)
          if ($module -eq [IntPtr]::Zero) { throw '无法读取 EXE 资源' }
          try {
              foreach ($id in 1, 2, 3) {
                  if ([ReleaseResources]::FindResourceW($module, [IntPtr]$id, [IntPtr]14) -eq [IntPtr]::Zero) { throw "缺少图标组 $id" }
              }
              $resource = [ReleaseResources]::FindResourceW($module, [IntPtr]1, [IntPtr]24)
              if ($resource -eq [IntPtr]::Zero) { throw '缺少应用清单' }
              $length = [ReleaseResources]::SizeofResource($module, $resource)
              $pointer = [ReleaseResources]::LockResource([ReleaseResources]::LoadResource($module, $resource))
              if ($length -eq 0 -or $pointer -eq [IntPtr]::Zero) { throw '应用清单无法读取' }
              $bytes = New-Object byte[] $length
              [Runtime.InteropServices.Marshal]::Copy($pointer, $bytes, 0, $length)
              $manifestText = [Text.Encoding]::UTF8.GetString($bytes).Trim([char]0, [char]0xFEFF)
              if ($manifestText.Contains('{{') -or $manifestText.Contains('}}')) { throw '应用清单含未展开的模板变量' }
              [xml]$manifest = $manifestText
              if ($manifest.assembly.assemblyIdentity.name -cne 'PetMax.LiteratureTranslation' -or $manifest.assembly.assemblyIdentity.version -cne $fixed) { throw '应用清单标识或版本错误' }
          } finally { [void][ReleaseResources]::FreeLibrary($module) }
          $ctx = New-Object ReleaseResources+ACTCTX
          $ctx.cbSize = [Runtime.InteropServices.Marshal]::SizeOf($ctx)
          $ctx.dwFlags = 8
          $ctx.lpSource = $exe
          $ctx.lpResourceName = [IntPtr]1
          $handle = [ReleaseResources]::CreateActCtxW([ref]$ctx)
          if ($handle -eq [IntPtr](-1)) { throw [ComponentModel.Win32Exception]::new([Runtime.InteropServices.Marshal]::GetLastWin32Error()) }
          [ReleaseResources]::ReleaseActCtx($handle)
          Write-Output 'EXE 版本、图标和激活上下文检查通过'

      - name: Stage payload
        shell: pwsh
        run: |
          $stage = "build/package/Literature-Translation"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item build/bin/Literature-Translation.exe $stage/
          Copy-Item LICENSE $stage/

      - uses: actions/upload-artifact@v4
        with:
          # 名称带 run_attempt：区分重跑批次，下游按本次 attempt 名精确取包
          name: staging-${{ github.run_attempt }}
          path: build/package/Literature-Translation
          retention-days: 3
          if-no-files-found: error

  # ── Job 4：打包便携版（与安装版并行，独立计时） ────────────────────────
  package-portable:
    name: 打包便携版
    needs: [build, resolve]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: staging-${{ github.run_attempt }}
          path: build/package/Literature-Translation
      - name: Portable zip
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force build/bin | Out-Null
          Compress-Archive -Force -Path build/package/Literature-Translation -DestinationPath "build/bin/Literature-Translation-${env:RELEASE_TAG}-windows-amd64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ github.run_attempt }}
          path: build/bin/*-portable.zip
          retention-days: 3
          if-no-files-found: error

  # ── Job 5：打包安装版（与便携版并行，独立计时） ────────────────────────
  package-installer:
    name: 打包安装版
    needs: [build, resolve]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # installer.iss / icon / 中文语言包 / LICENSE 是打包输入，从对应 ref 检出
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}
      - uses: actions/download-artifact@v4
        with:
          name: staging-${{ github.run_attempt }}
          path: build/package/Literature-Translation
      - name: Installer (Inno Setup)
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force build/bin | Out-Null
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:RELEASE_VERSION" build/installer/installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ github.run_attempt }}
          path: build/bin/*-Setup-*.exe
          retention-days: 3
          if-no-files-found: error

  # ── Job 6：发布（needs 全部上游；通道门条件——未选发布则跳过留产物） ─────
  publish:
    name: 发布_Release
    needs: [gate, resolve, package-portable, package-installer]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write # 创建 Release 与上传产物
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.resolve.outputs.tag }}
      PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
      TARGET_SHA: ${{ needs.resolve.outputs.checkout_ref }}
    steps:
      # 发布脚本使用触发时的固定提交，发布数据使用 TARGET_SHA
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: "{portable,installer}-${{ github.run_attempt }}"
          path: dist
          merge-multiple: true

      - name: Checksums (SHA-256)
        shell: pwsh
        run: |
          $expected = @("Literature-Translation-${env:TAG}-windows-amd64-portable.zip", "Literature-Translation-Setup-${env:TAG}-windows-amd64.exe")
          $files = @(Get-ChildItem -LiteralPath dist -File -Force)
          if ($files.Count -ne 2 -or @($files | Where-Object { $_.Name -cnotin $expected -or $_.Length -eq 0 }).Count -ne 0) { throw '发布产物不完整或包含其他批次文件' }
          $files | Sort-Object Name |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii dist/checksums.txt
          Get-Content dist/checksums.txt

      - name: Release notes + create + upload
        shell: pwsh
        # 逻辑外置：.github/scripts/publish-release.ps1（env 经 job 级注入）
        run: .github/scripts/publish-release.ps1
