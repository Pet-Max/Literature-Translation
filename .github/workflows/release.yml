# release.yml — 发布工作流：tag v* 推送 / 手动触发 → 门禁 → 解析版本 → 构建
#              → 打包便携版 ∥ 打包安装版（并行、各自计时）→ 发布 Release。
# 门禁复用 .github/actions/gate（与 check.yml 同一实现）；本工作流永不触发于分支 push。
#
# ── 触发场景对照 ─────────────────────────────────────────────────────
#   push v* tag                   → 门禁 → 守卫 → 构建 → 双包并行 → 稳定版发布
#   dispatch（channel=stable）    → 重发最新稳定版 / 指定 tag（守卫生效；tag 须已存在）
#   dispatch（channel=prerelease）→ 版本覆盖或自动+1，预发布（跳过守卫，tag 可代建）
#   dispatch（publish 不勾）      → 只构建不发布，产物留在 run Artifacts 供人工检查
# ─────────────────────────────────────────────────────────────────────
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "发布通道"
        required: false
        type: choice
        options: [stable, prerelease]
        default: stable
      tag:
        description: "版本号覆盖（如 v1.2.0-rc.1）；留空自动推算。stable 通道须为远端已存在的 tag"
        required: false
        type: string
      publish:
        description: "构建后发布 Release（不勾 = 只构建，产物留 Artifacts）"
        required: false
        type: boolean
        default: true

permissions:
  contents: read # 默认只读；publish job 单独提权写 Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # 发布不可互相打断：排队执行

jobs:
  # ── Job 1：质量门禁（复用 composite，与 check.yml 同一实现） ──────────
  gate:
    name: 质量门禁
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/gate

  # ── Job 2：解析版本号（通道决定守卫与推算；outputs 含 publish 门条件） ──
  resolve:
    name: 解析版本号
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT: ${{ github.event_name }}
      CHANNEL: ${{ inputs.channel }}
      OVERRIDE: ${{ inputs.tag }}
      PUBLISH_INPUT: ${{ inputs.publish }}
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: 解析版本号
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          STABLE_LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq 'map(select(.prerelease == false)) | .[0].tag_name' 2>/dev/null || true)
          case "$EVENT-$CHANNEL" in
            push-* )            # tag push：稳定版，一律发布
              TAG="$GITHUB_REF_NAME"; REF="$TAG"; PRERELEASE=false; PUBLISH=true ;;
            dispatch-prerelease )
              # 预发布：版本可覆盖；留空 = 最新稳定版补丁+1；tag 不存在时发布代建
              if [ -n "$OVERRIDE" ]; then TAG="$OVERRIDE"
              else
                [ -n "$STABLE_LATEST" ] || { echo "::error::仓库无稳定版可推算，请填版本号"; exit 1; }
                MAJOR=$(printf '%s' "$STABLE_LATEST" | sed -E 's/^v([0-9]+)\..*/\1/')
                MINOR=$(printf '%s' "$STABLE_LATEST" | sed -E 's/^v[0-9]+\.([0-9]+)\..*/\1/')
                PATCH=$(printf '%s' "$STABLE_LATEST" | sed -E 's/^v[0-9]+\.[0-9]+\.([0-9]+).*/\1/')
                TAG="v$MAJOR.$MINOR.$((PATCH + 1))"
              fi
              REF="$GITHUB_REF"; PRERELEASE=true ;;
            * )                 # stable：重发最新稳定版 / 指定已存在 tag（守卫生效）
              if [ -n "$OVERRIDE" ]; then TAG="$OVERRIDE"
              else
                [ -n "$STABLE_LATEST" ] || { echo "::error::仓库无稳定版可重发，请填 tag"; exit 1; }
                TAG="$STABLE_LATEST"
              fi
              REF="$TAG"; PRERELEASE=false; PUBLISH=true ;;
          esac
          # 版本守卫：稳定通道读「tag 自己的」internal/version 比对——稳定留空
          # 重发时 resolve 检出的是 main，读工作区会误杀合法重发（探针实证）
          if [ "$PRERELEASE" = "false" ]; then
            SRC=$(gh api "repos/$GITHUB_REPOSITORY/contents/internal/version/version.go?ref=$TAG"
              --jq '.content' | base64 -d | sed -nE 's/.*"\"(v[^"]+)"\".*/\1/p')
            if [ "$TAG" != "$SRC" ]; then
              echo "::error::tag($TAG) 与 internal/version($SRC) 不一致"
              exit 1
            fi
          fi
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"  >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$REF" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH"  >> "$GITHUB_OUTPUT"

  # ── Job 3：构建主程序（只编译一次，staging 供两个打包 job 并行取料） ────
  build:
    name: 构建主程序
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Build main exe
        run: go build -tags desktop,production -ldflags "-H windowsgui" -o build/bin/Literature-Translation.exe .

      # 嵌入式 Python 运行时（与本地 scripts\prepare_runtime.bat 同款）
      - name: Prepare embedded python runtime
        shell: pwsh
        run: |
          $rt = "build/runtime"
          New-Item -ItemType Directory -Force $rt | Out-Null
          Invoke-WebRequest "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip" -OutFile "$rt/py.zip"
          Expand-Archive -Force "$rt/py.zip" $rt
          Remove-Item "$rt/py.zip"
          (Get-Content "$rt/python312._pth") -replace '#\s*import site','import site' | Set-Content "$rt/python312._pth"
          Add-Content "$rt/python312._pth" "Lib/site-packages"
          Invoke-WebRequest https://bootstrap.pypa.io/get-pip.py -OutFile "$rt/get-pip.py"
          & "$rt\python.exe" "$rt/get-pip.py" --no-warn-script-location --quiet
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$rt\python.exe" -m pip install --quiet --no-warn-script-location pymupdf httpx
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item "$rt/get-pip.py"
          & "$rt\python.exe" -c "import fitz, httpx; print('runtime OK')" 2>$null
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Stage payload
        shell: pwsh
        run: |
          $stage = "build/package/Literature-Translation"
          New-Item -ItemType Directory -Force "$stage/engine" | Out-Null
          Copy-Item build/bin/Literature-Translation.exe $stage/
          Copy-Item engine/*.py "$stage/engine/"
          # robocopy 语义确定；Copy-Item 对「目标不存在 + 通配递归」有 leaf/container 坑
          robocopy build/runtime "$stage/runtime" /E /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) { exit 1 }
          # robocopy 成功码是 1..7：不清零会被 pwsh 当作步骤失败
          $global:LASTEXITCODE = 0
          Copy-Item LICENSE $stage/

      - uses: actions/upload-artifact@v4
        with:
          # run_attempt 后缀：Re-run all jobs 重建同名产物不再冲突
          name: staging-${{ github.run_attempt }}
          path: build/package/Literature-Translation
          retention-days: 3

  # ── Job 4：打包便携版（与安装版并行，独立计时） ────────────────────────
  package-portable:
    name: 打包便携版
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: staging-${{ github.run_attempt }}
          path: build/package/Literature-Translation
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Force -Path build/package/Literature-Translation -DestinationPath "build/bin/Literature-Translation-${{ needs.resolve.outputs.tag }}-windows-amd64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ github.run_attempt }}
          path: build/bin/*-portable.zip
          retention-days: 3

  # ── Job 5：打包安装版（与便携版并行，独立计时） ────────────────────────
  package-installer:
    name: 打包安装版
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # installer.iss / icon / 中文语言包 / LICENSE 是打包输入，从对应 ref 检出
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}
      - uses: actions/download-artifact@v4
        with:
          name: staging-${{ github.run_attempt }}
          path: build/package/Literature-Translation
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          & $iscc /DAppVersion=${{ needs.resolve.outputs.version }} build/installer/installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ github.run_attempt }}
          path: build/bin/*-Setup-*.exe
          retention-days: 3

  # ── Job 6：发布（needs 全部上游；通道门条件——未选发布则跳过留产物） ─────
  publish:
    name: 发布_Release
    needs: [gate, resolve, package-portable, package-installer]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write # 创建 Release 与上传产物
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.resolve.outputs.tag }}
      PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{portable,installer}-*"
          path: dist
          merge-multiple: true

      - name: Checksums (SHA-256)
        shell: pwsh
        run: |
          Get-ChildItem dist |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii dist/checksums.txt
          Get-Content dist/checksums.txt

      - name: Release notes + create + upload
        shell: pwsh
        run: |
          $tag = "$env:TAG"
          $owner = ($env:GITHUB_REPOSITORY -split '/')[0]
          # 发布页三段式：Changelog（全部 commit + 短哈希）→ What's Changed /
          # New Contributors（仅当有合并 PR）→ Full Changelog。
          # 不用 --generate-notes：个人仓库不走 PR，其 PR 段永远为空。
          # 一次 API 调用同时取「首行标题 + 短哈希」：commit 消息按行输出
          # 会被拍平，PR 提取只对首行做，避免把 commit 正文里的 "(#N)"
          # 引用误认为合并的 PR。短哈希与 tag 区间在 Release 页由 GitHub
          # 自动渲染为链接。
          $prev = gh api "repos/$env:GITHUB_REPOSITORY/releases" --jq 'map(select(.prerelease == false)) | .[0].tag_name' 2>$null
          if ($prev) {
            $rows = gh api "repos/$env:GITHUB_REPOSITORY/compare/$prev...$tag" --jq '.commits[] | (.commit.message | split("\n")[0]) + "\t" + .sha[0:7]'
          } else {
            # 首个发布：无对比基准，取 tag 历史上的提交
            $rows = gh api "repos/$env:GITHUB_REPOSITORY/commits?sha=$tag&per_page=50" --jq '.[] | (.commit.message | split("\n")[0]) + "\t" + .sha[0:7]'
          }
          $commits = @()
          $prTitles = @{}
          foreach ($r in $rows) {
            $p = $r -split "`t", 2
            $commits += "* " + $p[0] + " (" + $p[1] + ")"
            if ($p[0] -match '\(#(\d+)\)\s*$' -or $p[0] -match '^Merge pull request #(\d+) from') {
              $prTitles[[int]$Matches[1]] = $p[0]
            }
          }
          $prNums = @($prTitles.Keys | Sort-Object)
          $notes = "## Changelog`n`n" + ($commits -join "`n") + "`n"
          if ($prNums.Count -gt 0) {
            # 有 PR：What's Changed 列 PR（标题+作者+短链）；New Contributors
            # 列仓库所有者之外的 PR 作者——个人仓库阶段外部作者即新贡献者，
            # 常客出现后可在发布页手动校正措辞
            $lines = @()
            $newC = @()
            $userPr = @{}
            foreach ($n in $prNums) {
              $info = gh api "repos/$env:GITHUB_REPOSITORY/pulls/$n" --jq '.title + "\t" + .user.login' 2>$null
              if ($info) {
                $title, $user = $info -split "`t", 2
                $lines += "* $title by @$user in #$n"
                if ($user -and $user -ne $owner -and -not $userPr.ContainsKey($user)) {
                  $userPr[$user] = $n
                  $newC += $user
                }
              } else {
                # (#N) 引用的是 issue 而非 PR：按 commit 标题列出，不加 PR 链接
                $lines += "* $($prTitles[$n])"
              }
            }
            $notes += "`n## What's Changed`n`n" + ($lines -join "`n") + "`n"
            if ($newC.Count -gt 0) {
              $notes += "`n## New Contributors`n`n"
              foreach ($u in $newC) {
                $notes += "* @$u made their first contribution in #$($userPr[$u])`n"
              }
              $notes += "`n"
            }
          }
          $changelog = if ($prev) { "$prev...$tag" } else { "$env:GITHUB_REPOSITORY/commits/$tag" }
          $notes += "`n**Full Changelog**: $changelog"
          $notesFile = "$env:RUNNER_TEMP/release-notes.md"
          Set-Content -Path $notesFile -Value $notes -Encoding utf8NoBOM
          # 稳定版：tag 已存在 → --verify-tag；预发布：tag 不存在 → 发布时由
          # gh 代建于当前 commit（--target），并标记 --prerelease
          $relFlags = @()
          if ($env:PRERELEASE -eq 'true') {
            $relFlags += @('--prerelease', '--target', "$env:GITHUB_SHA")
          } else {
            $relFlags += '--verify-tag'
          }
          # 已存在同版本 Release（重发场景）→ 编辑更新说明；不存在 → 创建
          if (gh release view $tag 2>$null) {
            gh release edit $tag --notes-file $notesFile
          } else {
            gh release create $tag --title $tag --notes-file $notesFile @relFlags
          }
          $zip = "Literature-Translation-$tag-windows-amd64-portable.zip"
          $exe = "Literature-Translation-Setup-$tag-windows-amd64.exe"
          gh release upload $tag "dist/$zip" "dist/$exe" "dist/checksums.txt" --clobber
