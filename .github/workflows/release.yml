# release.yml — 发布工作流：tag v* 推送 / 手动触发 → 门禁 → 解析版本 → 构建
#              → 打包便携版 ∥ 打包安装版（并行、各自计时）→ 发布 Release。
# 门禁复用 .github/actions/gate（与 check.yml 同一实现）；本工作流永不触发于分支 push。
#
# ── 触发场景对照 ─────────────────────────────────────────────────────
#   push v* tag                   → 门禁 → 守卫 → 构建 → 双包并行 → 稳定版发布
#   dispatch（channel=stable）    → 重发最新稳定版 / 指定 tag（守卫生效；tag 须已存在）
#   dispatch（channel=prerelease）→ 版本覆盖或自动+1，预发布（跳过守卫，tag 可代建）
#   dispatch（publish 不勾）      → 只构建不发布，产物留在 run Artifacts 供人工检查
# ─────────────────────────────────────────────────────────────────────
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "发布通道"
        required: false
        type: choice
        options: [stable, prerelease]
        default: stable
      tag:
        description: "版本号覆盖（如 v1.2.0-rc.1）；留空自动推算。stable 通道须为远端已存在的 tag"
        required: false
        type: string
      publish:
        description: "构建后发布 Release（不勾 = 只构建，产物留 Artifacts）"
        required: false
        type: boolean
        default: true

permissions:
  contents: read # 默认只读；publish job 单独提权写 Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # 发布不可互相打断：排队执行

jobs:
  # ── Job 1：质量门禁（复用 composite，与 check.yml 同一实现） ──────────
  gate:
    name: 质量门禁
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/gate

  # ── Job 2：解析版本号（通道决定守卫与推算；outputs 含 publish 门条件） ──
  resolve:
    name: 解析版本号
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT: ${{ github.event_name }}
      CHANNEL: ${{ inputs.channel }}
      OVERRIDE: ${{ inputs.tag }}
      PUBLISH_INPUT: ${{ inputs.publish }}
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      # 检出触发 ref：脚本文件在工作区里；tag 场景检出 tag，dispatch 检出所选分支
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: 解析版本号
        id: resolve
        shell: bash
        # 逻辑外置：.github/workflows/scripts/resolve-version.sh（env 经 job 级注入）
        run: bash .github/workflows/scripts/resolve-version.sh

  # ── Job 3：构建主程序（只编译一次，staging 供两个打包 job 并行取料） ────
  build:
    name: 构建主程序
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Build main exe
        run: go build -tags desktop,production -ldflags "-H windowsgui" -o build/bin/Literature-Translation.exe .

      # 嵌入式 Python 运行时（与本地 scripts\prepare_runtime.bat 同款）
      - name: Prepare embedded python runtime
        shell: pwsh
        run: |
          $rt = "build/runtime"
          New-Item -ItemType Directory -Force $rt | Out-Null
          Invoke-WebRequest "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip" -OutFile "$rt/py.zip"
          Expand-Archive -Force "$rt/py.zip" $rt
          Remove-Item "$rt/py.zip"
          (Get-Content "$rt/python312._pth") -replace '#\s*import site','import site' | Set-Content "$rt/python312._pth"
          Add-Content "$rt/python312._pth" "Lib/site-packages"
          Invoke-WebRequest https://bootstrap.pypa.io/get-pip.py -OutFile "$rt/get-pip.py"
          & "$rt\python.exe" "$rt/get-pip.py" --no-warn-script-location --quiet
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$rt\python.exe" -m pip install --quiet --no-warn-script-location pymupdf httpx
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item "$rt/get-pip.py"
          & "$rt\python.exe" -c "import fitz, httpx; print('runtime OK')" 2>$null
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Stage payload
        shell: pwsh
        run: |
          $stage = "build/package/Literature-Translation"
          New-Item -ItemType Directory -Force "$stage/engine" | Out-Null
          Copy-Item build/bin/Literature-Translation.exe $stage/
          Copy-Item engine/*.py "$stage/engine/"
          # robocopy 语义确定；Copy-Item 对「目标不存在 + 通配递归」有 leaf/container 坑
          robocopy build/runtime "$stage/runtime" /E /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) { exit 1 }
          # robocopy 成功码是 1..7：不清零会被 pwsh 当作步骤失败
          $global:LASTEXITCODE = 0
          Copy-Item LICENSE $stage/

      - uses: actions/upload-artifact@v4
        with:
          # run_attempt 后缀：Re-run all jobs 重建同名产物不再冲突
          name: staging-${{ github.run_attempt }}
          path: build/package/Literature-Translation
          retention-days: 3

  # ── Job 4：打包便携版（与安装版并行，独立计时） ────────────────────────
  package-portable:
    name: 打包便携版
    needs: [build, resolve]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: staging-${{ github.run_attempt }}
          path: build/package/Literature-Translation
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/bin | Out-Null
          Compress-Archive -Force -Path build/package/Literature-Translation -DestinationPath "build/bin/Literature-Translation-${{ needs.resolve.outputs.tag }}-windows-amd64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ github.run_attempt }}
          path: build/bin/*-portable.zip
          retention-days: 3

  # ── Job 5：打包安装版（与便携版并行，独立计时） ────────────────────────
  package-installer:
    name: 打包安装版
    needs: [build, resolve]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # installer.iss / icon / 中文语言包 / LICENSE 是打包输入，从对应 ref 检出
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}
      - uses: actions/download-artifact@v4
        with:
          name: staging-${{ github.run_attempt }}
          path: build/package/Literature-Translation
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/bin | Out-Null
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          & $iscc /DAppVersion=${{ needs.resolve.outputs.version }} build/installer/installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ github.run_attempt }}
          path: build/bin/*-Setup-*.exe
          retention-days: 3

  # ── Job 6：发布（needs 全部上游；通道门条件——未选发布则跳过留产物） ─────
  publish:
    name: 发布_Release
    needs: [gate, resolve, package-portable, package-installer]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write # 创建 Release 与上传产物
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.resolve.outputs.tag }}
      PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
    steps:
      # 检出运行自身的 ref：发布脚本就在这份检出里（重发旧稳定版时也能拿到脚本）
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: "{portable,installer}-*"
          path: dist
          merge-multiple: true

      - name: Checksums (SHA-256)
        shell: pwsh
        run: |
          Get-ChildItem dist |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii dist/checksums.txt
          Get-Content dist/checksums.txt

      - name: Release notes + create + upload
        shell: pwsh
        # 逻辑外置：.github/workflows/scripts/publish-release.ps1（env 经 job 级注入）
        run: .github/workflows/scripts/publish-release.ps1
