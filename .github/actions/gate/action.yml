# 质量门禁（composite action）：check.yml 与 release.yml 共用的唯一门禁实现。
# 改门禁步骤只改这个文件。引用前必须先 checkout（本地 action）。
name: "质量门禁"
description: "六步：actionlint / go vet / ruff / Python 单测 / go test（含管线 E2E）/ 前端 E2E"
runs:
  using: composite
  steps:
    - name: actionlint（workflow 静态检查）
      shell: pwsh
      run: |
        $v = "1.7.7"
        Invoke-WebRequest "https://github.com/rhysd/actionlint/releases/download/v$v/actionlint_${v}_windows_amd64.zip" -OutFile "$env:RUNNER_TEMP/al.zip"
        Expand-Archive -Force "$env:RUNNER_TEMP/al.zip" "$env:RUNNER_TEMP/al"
        & "$env:RUNNER_TEMP/al/actionlint.exe" -color

    - uses: actions/setup-go@v6
      with:
        go-version: "1.26"

    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install Python deps
      shell: pwsh
      run: pip install pymupdf httpx ruff

    - name: go vet
      shell: pwsh
      run: go vet ./...

    - name: ruff check
      shell: pwsh
      run: python -m ruff check engine/

    - name: python unittest
      shell: pwsh
      run: python -m unittest discover -s engine/tests

    - name: go test (unit + fuzz seeds + pipeline E2E)
      shell: pwsh
      run: go test ./...

    - name: frontend E2E
      shell: pwsh
      run: |
        npm i --no-save playwright-core
        node tests/e2e_frontend.mjs
      env:
        CHROME_PATH: "C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe"
