name: 🐛 Bug 反馈
description: 报告安装、解析、翻译、排版或界面上的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先花一分钟确认下面几件事——能让问题更快定位。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已查看 README 的「常见问题」，确认不是已列出的高频问题
          required: true
        - label: 我已搜索[开放中的 issue](https://github.com/Pet-Max/Literature-Translation/issues)与[已关闭的 issue](https://github.com/Pet-Max/Literature-Translation/issues?q=is%3Aissue+state%3Aclosed)，没有发现重复
          required: true
        - label: 标题简明扼要，能一眼看出问题方向（不要只写「报错了」「用不了」）
          required: true
        - label: 我理解 issue 是用于反馈和解决问题，会尽量提供完整信息
          required: true

  - type: dropdown
    id: system
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - Windows Server / 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 侧栏左下角显示的版本号，或安装包文件名里的版本
      placeholder: 例如 v1.0.0
    validations:
      required: true

  - type: dropdown
    id: dist
    attributes:
      label: 使用形态
      options:
        - 安装版（Setup 安装）
        - 便携版（zip 解压）
        - 从源码构建
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: 问题环节
      description: 问题发生在哪个环节？
      options:
        - 安装 / 启动
        - 文件导入（拖放 / 点击上传）
        - MinerU 解析
        - LLM 翻译
        - PDF 排版导出
        - 归档目录
        - 界面（主题 / 字体 / 交互）
        - 其他
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: 入队模式
      description: 任务卡片上显示的模式
      options:
        - 自动
        - 翻译
        - 导出
        - 不适用（未到翻译环节）
    validations:
      required: true

  - type: dropdown
    id: filetype
    attributes:
      label: 文件类型
      options:
        - 英文 PDF
        - 英文 Markdown
        - 中文 Markdown
        - 其他
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 详细说明发生了什么。涉及界面问题请尽量附截图。
      placeholder: 期望是……实际是……（记得附截图）
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 让开发者能按步骤复现的完整操作序列
      placeholder: |
        1. 打开「…」
        2. 拖入「…」
        3. 点击「…」
        4. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你认为正确的结果应该是什么
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志内容
      description: 打开「日志」视图，复制与本次问题相关的行（含报错行）
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他有助于定位的信息（文件大小、页数、公式密度、模型名等）
    validations:
      required: false
