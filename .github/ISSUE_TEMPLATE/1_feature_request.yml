name: ✨ 功能建议
description: 提出新功能或改进现有功能的想法
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议！描述清楚「解决什么问题」比「要什么功能」更有说服力。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索[开放中的 issue](https://github.com/Pet-Max/Literature-Translation/issues)与[已关闭的 issue](https://github.com/Pet-Max/Literature-Translation/issues?q=is%3Aissue+state%3Aclosed)，没有重复的建议
          required: true
        - label: 我确认这是功能建议，不是 Bug 反馈（Bug 请用 Bug 模板）
          required: true
        - label: 标题简明扼要，能一眼看出建议方向
          required: true

  - type: dropdown
    id: category
    attributes:
      label: 建议分类
      options:
        - 解析能力（MinerU 相关）
        - 翻译能力（规则 / 术语 / 模型）
        - 排版导出（PDF / 字体 / 目录）
        - 归档管理
        - 界面与交互
        - 性能与体积
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你在什么场景下遇到了什么不便？越具体越好
      placeholder: 例如：翻译几十页的大文件时，中途想调整术语表但无法只重译某几段……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你认为理想的功能形态是什么样
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案或参考
      description: 其他软件的做法、临时绕过办法，或任何参考
    validations:
      required: false
